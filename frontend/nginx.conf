server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200M; # matches the backend's MAX_UPLOAD_BYTES for media uploads

    # Compress text responses (JS/CSS/SVG/JSON). Images and video are already
    # compressed formats, so they're left alone.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Reverse-proxy the API to the backend container, same origin as the
    # frontend — no CORS setup needed in production. API responses are never
    # cached by browsers or proxies (dashboard data, auth, forms).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # Vite's build output: every filename carries a content hash, so a file
    # never changes under the same name — safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /favicon.png {
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA fallback: any other path is a client-side route (the landing page,
    # /admin/*, or a dashboard-built page) — always serve index.html and let
    # React Router decide what to render. index.html is revalidated on every
    # visit so a new deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
