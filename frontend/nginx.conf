server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200M; # matches the backend's MAX_UPLOAD_BYTES for media uploads

    # Reverse-proxy the API to the backend container, same origin as the
    # frontend — no CORS setup needed in production.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any other path is a client-side route (the landing page,
    # /admin/*, or a dashboard-built page) — always serve index.html and let
    # React Router decide what to render.
    location / {
        try_files $uri /index.html;
    }
}
